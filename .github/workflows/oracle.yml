name: Criar Maquina Oracle
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - name: Executar script via Docker
        run: >
          docker run --rm
          -e OCI_REGION
          -e OCI_USER_ID
          -e OCI_TENANCY_ID
          -e OCI_KEY_FINGERPRINT
          -e OCI_PRIVATE_KEY
          -e OCI_COMPARTMENT_ID
          -e OCI_SUBNET_ID
          -e OCI_IMAGE_ID
          -e OCI_OCPUS
          -e OCI_MEMORY_IN_GBS
          ghcr.io/hitrov/oci-arm-host-capacity
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
