name: Criar Maquina Oracle
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - run: composer install --no-dev --optimize-autoloader

      - name: Configurar e Disparar
        run: |
          echo "$CHAVE_BRUTA" | tr -d '\r' > chave.pem
          chmod 600 chave.pem
          
          echo "OCI_REGION=${OCI_REGION}" >> .env
          echo "OCI_USER_ID=${OCI_USER_ID}" >> .env
          echo "OCI_TENANCY_ID=${OCI_TENANCY_ID}" >> .env
          echo "OCI_KEY_FINGERPRINT=${OCI_KEY_FINGERPRINT}" >> .env
          echo "OCI_PRIVATE_KEY_FILENAME=chave.pem" >> .env
          echo "OCI_AVAILABILITY_DOMAIN=qcUj:SA-SAOPAULO-1-AD-1" >> .env
          echo "OCI_COMPARTMENT_ID=${OCI_COMPARTMENT_ID}" >> .env
          echo "OCI_SUBNET_ID=${OCI_SUBNET_ID}" >> .env
          echo "OCI_IMAGE_ID=${OCI_IMAGE_ID}" >> .env
          echo "OCI_OCPUS=${OCI_OCPUS}" >> .env
          echo "OCI_MEMORY_IN_GBS=${OCI_MEMORY_IN_GBS}" >> .env
          
          php ./index.php
        env:
          CHAVE_BRUTA: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
